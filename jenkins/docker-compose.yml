services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    user: root
    privileged: true
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      # Use existing volume from first Jenkins install (keeps Resume_Builder job + build history)
      - jenkins_home:/var/jenkins_home
      # Docker Desktop (Windows/Mac/Linux): exposes host Docker to Jenkins
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - DOCKER_HOST=unix:///var/run/docker.sock

volumes:
  jenkins_home:
    external: true
