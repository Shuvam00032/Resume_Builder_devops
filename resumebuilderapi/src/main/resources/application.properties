spring.config.import=optional:file:./application-local.properties

# MongoDB (Docker Compose overrides with SPRING_DATA_MONGODB_URI)
spring.data.mongodb.uri=mongodb://localhost:27017/resumebuilder_v2

# Email — override via env (see docker-compose / .env). Brevo: verify sender in dashboard.
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${SPRING_MAIL_FROM:noreply@resumebuilder.local}

# Public URL for links in emails (Docker: http://localhost:3000)
app.base.url=${APP_BASE_URL:http://localhost:5173}

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000
app.auth.require-email-verification=${APP_AUTH_REQUIRE_EMAIL_VERIFICATION:true}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

jwt.secret=${JWT_SECRET:dev-docker-jwt-secret-key-min-32-chars-long-2026}
jwt.expiration=604800000

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
