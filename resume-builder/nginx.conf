server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Dynamic DNS resolution for Docker environment
    # 127.0.0.11 is the embedded Docker DNS server
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        # Using a variable forces Nginx to resolve the hostname dynamically
        # rather than crashing at startup if the backend is slow to boot.
        set $backend_upstream http://resume-backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        set $backend_upstream http://resume-backend:8080;
        proxy_pass $backend_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}