apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-builder-config
  namespace: resume-builder
data:
  APP_BASE_URL: "http://resume-builder.local"
  APP_CORS_ALLOWED_ORIGINS: "http://resume-builder.local,http://localhost:3000,http://localhost:5173"
  APP_AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
  SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/resumebuilder_v2"
  SPRING_MAIL_HOST: "smtp-relay.brevo.com"
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_FROM: "noreply@resumebuilder.local"
  VITE_API_URL: "http://resume-builder.local/api"
